  help: "<yellow><bold>Les mots clés pour la création d'une sélection sont (survol et clic possibles) : <click:run_command:'/sayinchat pos1'><hover:show_text:'<green>Cliquez pour définir la position 1'><gold><bold>pos1</hover></click><yellow><bold>, <click:run_command:'/sayinchat pos2'><hover:show_text:'<green>Cliquez pour définir la position 2'><gold><bold>pos2</hover></click><yellow><bold>, <click:run_command:'/sayinchat claim'><hover:show_text:'<green>Cliquez pour claim la sélection'><green><bold>claim</hover></click><yellow><bold>, <click:run_command:'/sayinchat unclaim'><hover:show_text:'<green>Cliquez pour unclaim la sélection'><red><bold>unclaim</hover></click><yellow><bold> et <click:run_command:'/sayinchat quit'><hover:show_text:'<green>Cliquez pour quitter le mode sélection'><red><bold>quitter</hover></click><yellow><bold>."
  help_admin: "<yellow><bold>Admin : <click:run_command:'/sayinchat forceunclaim'><hover:show_text:'<green>Unclaim TOUS les chunks de la sélection'><red><bold>forceunclaim</hover></click>"
