    warning: "<red><bold>Attention, le sous-territoire doit se trouver dans votre territoire pour fonctionner."
    saved: "<green><bold>La sélection a été sauvegardée avec succès."
    outside: "<red><bold>La sélection doit se trouver dans le territoire <land>."
    help: "<yellow><bold>Les mots clés pour la création d'une sélection sont (survol et clic possibles) : <click:run_command:'/sayinchat pos1'><hover:show_text:'<green>Cliquez pour définir la position 1'><gold><bold>pos1</hover></click><yellow><bold>, <click:run_command:'/sayinchat pos2'><hover:show_text:'<green>Cliquez pour définir la position 2'><gold><bold>pos2</hover></click><yellow><bold>, <click:run_command:'/sayinchat sauvegarder'><hover:show_text:'<green>Cliquez pour sauvegarder la zone'><green><bold>sauvegarder</hover></click><yellow><bold> et <click:run_command:'/sayinchat quit'><hover:show_text:'<green>Cliquez pour quitter le mode sélection'><red><bold>quitter</hover></click><yellow><bold>."

help:
  text: |-
    <#fbeba7>La protection de vos territoires se gère avec les commandes ci-dessous.

    <#fbeba7>- <click:suggest_command:'/lands'><hover:show_text:'<gray>Clic pour écrire la commande'><#B95608>/lands</hover></click> - Ouvre le menu de gestion de vos territoires.
    <#fbeba7>- <click:suggest_command:'/land claim '><hover:show_text:'<gray>Clic pour écrire la commande'><#B95608>/land claim [territoire]</hover></click> - Attribue le tronçon où vous vous trouvez au territoire choisi ou à votre premier territoire.
    <#fbeba7>- <click:suggest_command:'/land unclaim'><hover:show_text:'<gray>Clic pour écrire la commande'><#B95608>/land unclaim</hover></click> - Retire le tronçon où vous vous trouvez de vos territoires.
    <#fbeba7>- <click:suggest_command:'/land map '><hover:show_text:'<gray>Clic pour écrire la commande'><#B95608>/land map [territoire]</hover></click> - Affiche une carte des territoires alentour. Permet de claim/unclaim si un territoire est sélectionné.
    <#fbeba7>- <click:suggest_command:'/land kick '><hover:show_text:'<gray>Clic pour écrire la commande'><#B95608>/land kick [joueur]</hover></click> - Renvoie au spawn un joueur qui se trouve dans votre territoire.
    <#fbeba7>- <click:suggest_command:'/land seeclaims'><hover:show_text:'<gray>Clic pour écrire la commande'><#B95608>/land seeclaims</hover></click> - Permet de voir les bordures des claims.

    <#fbeba7>Les <#B95608>tronçons (chunks)</#B95608> mesurent <#B95608>16x256x16 blocs</#B95608> et sont visibles en appuyant sur les touches <#B95608>F3+G</#B95608>.

